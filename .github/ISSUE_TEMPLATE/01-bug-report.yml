name: 缺陷反馈 / Bug report
description: 报告可复现的错误、崩溃或异常行为 / Report a bug, crash or unexpected behavior.
title: '[Bug] '
body:
  - type: markdown
    attributes:
      value: |-
        本仓库受理 / This repository covers: 系统运行库、服务、UI、SDK、DevKit、Agent Kit、打包工具与模拟器实现 / System runtime, services, UI, SDK, DevKit, Agent Kit, packaging tools and simulator implementation。

        - [pxa-workspace](https://github.com/SmartArduino/pxa-workspace/issues/new/choose): ESP 固件、板级驱动、烧录、工作区脚本与显示配置 / ESP firmware, board drivers, flashing, workspace scripts and display profiles。
        - [pxa-apps](https://github.com/SmartArduino/pxa-apps/issues/new/choose): PXA 应用、游戏、商城客户端与 common 共享应用代码 / PXA apps, games, store client and shared application code。

        不确定归属时，可按观察到的问题提交，并关联其他仓库中的相关 Issue；同一问题请勿重复提交。 / If unsure, report what you observed and link related issues; avoid duplicate reports.
        可使用中文或英文填写。 / Chinese or English is welcome.
  - type: checkboxes
    id: preflight
    attributes:
      label: 提交前检查 / Before submitting
      options:
        - label: 我已搜索[现有 Issue](https://github.com/SmartArduino/pxa-system/issues?q=is%3Aissue)，未找到相同反馈。 / I searched existing
            issues and found no duplicate.
          required: true
  - type: dropdown
    id: component
    attributes:
      label: 涉及模块 / Component
      options:
        - Host 运行库与 ABI / Host runtime and ABI
        - 系统核心与服务 / System core and services
        - 系统 UI 与渲染器 / System UI and renderers
        - Guest SDK 与应用模板 / Guest SDK and app templates
        - DevKit、打包与签名工具 / DevKit, packaging and signing tools
        - Agent Kit 与 MCP / Agent Kit and MCP
        - 模拟器实现 / Simulator implementation
        - 不确定或其他 / Unsure or other
    validations:
      required: true
  - type: textarea
    id: version
    attributes:
      label: 版本信息 / Versions
      description: 提供 DevKit/SDK 版本或 pxa-system 提交；相关时补充设备固件及应用锁定的 SDK 版本。不知道的项目可写 unknown。 / Include the DevKit/SDK version
        or system commit, plus device firmware and locked SDK versions when relevant; use unknown if unavailable.
      placeholder: |-
        DevKit / SDK version (pxa --version):
        pxa-system commit (source builds only):
        Device firmware version (if relevant):
        SDK release from pxa.lock (if relevant):
        Agent Kit version (if relevant):
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 运行环境 / Environment
      description: 注明主机系统、运行目标和执行方式；真机问题补充板型、芯片，UI 问题补充屏幕 Profile。不适用的项目可写 N/A。 / Include host OS, runtime target and execution
        mode, with board/chip for devices or display profile for UI issues; use N/A where appropriate.
      placeholder: |-
        Host OS / architecture:
        Device / desktop simulator / headless simulator / browser:
        Board / chip / display profile (if relevant):
        Execution mode / package target (if known):
        Compiler / CMake / Python / browser versions (if relevant):
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: 实际表现 / Actual behavior
      description: 描述具体错误及影响；一次反馈一个问题。 / Describe the error and its impact; report one problem per issue.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤 / Steps to reproduce
      description: 提供完整命令、配置或最小示例；偶发问题请写明触发条件与频率。 / Include exact commands, configuration or a minimal example; describe triggers
        and frequency for intermittent issues.
      placeholder: |-
        1. 准备版本、目标与最小工程 / Prepare versions, target and minimal project
        2. 执行命令或调用 API / Run the command or call the API
        3. 观察结果 / Observe the result
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期表现 / Expected behavior
      description: 说明在相同步骤下期望发生什么。 / Describe what should happen with the same steps.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 相关日志 / Logs
      description: 粘贴构建、串口、崩溃或模拟器日志，并保留错误前后的上下文；无需手写代码块。提交前移除私钥、令牌和个人信息。 / Paste relevant logs with surrounding context, without
        code fences; remove private keys, tokens and personal data.
      render: text
    validations:
      required: false
  - type: textarea
    id: additional
    attributes:
      label: 附件与补充信息 / Attachments and context
      description: 可拖入截图、录屏或最小复现文件；如已知，补充正常版本、回归范围、变通方法及相关 Issue 链接。 / Attach screenshots, recordings or a minimal reproducer;
        include known working versions, workarounds and related issues if available.
    validations:
      required: false

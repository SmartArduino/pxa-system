name: 中文｜缺陷反馈
description: 报告可复现的错误、崩溃或异常行为
title: '[缺陷] '
body:
  - type: markdown
    attributes:
      value: |-
        本仓库受理：系统运行库、服务、UI、SDK、DevKit、Agent Kit、打包工具与模拟器实现。

        - [pxa-workspace](https://github.com/SmartArduino/pxa-workspace/issues/new?template=01-bug-report.zh-CN.yml)：ESP 固件、板级驱动、烧录、工作区脚本与显示配置。
        - [pxa-apps](https://github.com/SmartArduino/pxa-apps/issues/new?template=01-bug-report.zh-CN.yml)：PXA 应用、游戏、商城客户端与 common 共享应用代码。

        不确定归属时，可按观察到的问题提交，并关联其他仓库中的相关 Issue；同一问题请勿重复提交。
  - type: checkboxes
    id: preflight
    attributes:
      label: 提交前检查
      options:
        - label: 我已搜索[现有 Issue](https://github.com/SmartArduino/pxa-system/issues?q=is%3Aissue)，未找到相同反馈。
          required: true
  - type: dropdown
    id: component
    attributes:
      label: 涉及模块
      options:
        - Host 运行库与 ABI
        - 系统核心与服务
        - 系统 UI 与渲染器
        - Guest SDK 与应用模板
        - DevKit、打包与签名工具
        - Agent Kit 与 MCP
        - 模拟器实现
        - 不确定或其他
    validations:
      required: true
  - type: textarea
    id: version
    attributes:
      label: 版本信息
      description: 提供 DevKit/SDK 版本或 pxa-system 提交；相关时补充设备固件及应用锁定的 SDK 版本。无法确认的项目可填写“不清楚”。
      placeholder: |-
        DevKit、SDK 版本（pxa --version）：
        pxa-system 提交（仅源码构建）：
        设备固件版本（如相关）：
        pxa.lock 中锁定的 SDK 发行版本（如相关）：
        Agent Kit 版本（如相关）：
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 运行环境
      description: 注明主机系统、运行目标和执行方式；真机问题补充板型、芯片，UI 问题补充屏幕显示配置。不适用的项目可填写“不适用”。
      placeholder: |-
        主机系统与架构：
        真机、桌面模拟器、无界面模拟器或浏览器：
        板型、芯片与屏幕显示配置（如相关）：
        执行模式与应用包目标架构（如已知）：
        编译器、CMake、Python 与浏览器版本（如相关）：
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: 实际表现
      description: 描述具体错误及影响；一次反馈一个问题。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 提供完整命令、配置或最小示例；偶发问题请写明触发条件与频率。
      placeholder: |-
        1. 准备版本、目标与最小工程
        2. 执行命令或调用 API
        3. 观察结果
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期表现
      description: 说明在相同步骤下期望发生什么。
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 相关日志
      description: 粘贴构建、串口、崩溃或模拟器日志，并保留错误前后的上下文；无需手写代码块。提交前移除私钥、令牌和个人信息。
      render: text
    validations:
      required: false
  - type: textarea
    id: additional
    attributes:
      label: 附件与补充信息
      description: 可拖入截图、录屏或最小复现文件；如已知，补充正常版本、回归范围、变通方法及相关 Issue 链接。
    validations:
      required: false
